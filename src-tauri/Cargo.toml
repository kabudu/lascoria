[package]
name = "spatial-constellation-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lascoria-runtime = { path = "../runtime-support" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.11"
dunce = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "process", "fs", "sync", "macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
