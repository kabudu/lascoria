<text x="60" y="142" font-size="44" font-weight="650" letter-spacing="-1.6">A map for you. A durable runtime for the work.</text>
<text x="61" y="181" class="body">Clear ownership from the desktop to each independent Muse session.</text>
<text x="61" y="237" class="eyebrow">ON YOUR COMPUTER</text>
