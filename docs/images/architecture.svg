<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
<title id="title">Lascoria architecture: a spatial workspace, durable Rust control and official Muse execution</title>
<desc id="description">The Tauri and React desktop exchanges commands and observed state with a local Rust supervisor. Rust owns the journal, recovery, session lanes, local session relay, worktrees and evidence. An official Node SDK broker connects independent contexts to one Muse Code host per session. SQLite holds local state; the operating-system vault holds credentials. Muse connects to the user's model provider. Optional decision APIs require a separate key and workspace consent. The desktop window and runtime have separate lifetimes.</desc>
