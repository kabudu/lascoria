# Release Lascoria from a version tag, following the qatq release process:
#
# * a pushed tag such as v1.2.3 (or v1.2.3-beta.1 for a prerelease) starts it;
# * the tag must point at a commit on the default branch, and every version field,
#   the CHANGELOG.md section and the curated docs/releases/v<version>.md must agree
#   (scripts/release.js verify);
# * each supported OS/architecture is built natively, signed and, on macOS, notarized;
# * updater bundles are signed with the maintainer's updater key, and a signed
#   latest.json plus SHA256SUMS.txt are generated;
# * a GitHub Release is created with the curated title and notes and every package.
#
# Hosted Actions stay disabled while the repository is private; this workflow also skips
# itself on a private repository. Required secrets and variables are listed in
# docs/RELEASE.md. Nothing here pushes commits or tags.
name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Require release tags to point at the default branch
        shell: bash
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - name: Check versions, CHANGELOG and curated notes against the tag
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          result=$(node scripts/release.js verify "$GITHUB_REF_NAME")
          echo "version=$(jq -r .version <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Refuse known vulnerabilities and unreviewed licences or advisories
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rustup toolchain install 1.97 --profile minimal
          cargo install cargo-audit --locked --version 0.22.2
          node scripts/check-supply-chain.js
      - name: Require release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.LASCORIA_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY must be configured}"
          : "${UPDATER_PUBKEY:?The LASCORIA_UPDATER_PUBKEY variable must be configured}"
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE must be configured}"
          : "${APPLE_ID:?APPLE_ID must be configured}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID must be configured}"

  build:
    needs: plan
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-aarch64, runner: macos-15, bundles: 'app,dmg' }
          - { target: darwin-x86_64, runner: macos-15-intel, bundles: 'app,dmg' }
          - { target: windows-x86_64, runner: windows-2022, bundles: 'nsis' }
          - { target: linux-x86_64, runner: ubuntu-22.04, bundles: 'appimage,deb' }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.97'
      VERSION: ${{ needs.plan.outputs.version }}
      # Baked into the desktop binary: the updater accepts only bundles signed by this key.
      LASCORIA_UPDATER_PUBKEY: ${{ vars.LASCORIA_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal
      - run: npm ci
      - name: Build the UI and the installed runtime (bundled Node, SDK and supervisor)
        run: npm run desktop:prepare
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign bundled runtime executables for notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements src-tauri/entitlements/node.plist .dev/bundle-runtime/node
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" \
            .dev/bundle-runtime/constellation-supervisor
      - name: Build, sign and notarize the desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          # The runtime is already prepared (and signed on macOS); do not rebuild it here.
          config='{"build":{"beforeBuildCommand":"npm run ui:build"},"bundle":{"active":true,"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"'"$LASCORIA_UPDATER_PUBKEY"'"}}}'
          npx tauri build --bundles "${{ matrix.bundles }}" --config "$config"
      - name: Stage packages under release names
        shell: bash
        run: node scripts/release-artifacts.js stage "${{ matrix.target }}" "$VERSION" dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Write release notes, the updater manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.js title "$VERSION" > "$RUNNER_TEMP/title.txt"
          node scripts/release.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          node scripts/release-artifacts.js manifest dist-release "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      - name: Refuse to overwrite a published release
        shell: bash
        run: |
          set -euo pipefail
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published; reconcile it by hand." >&2
              exit 1
            fi
            # A draft left by an interrupted run was never visible to users: start it again.
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
      - name: Create the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          flag=""
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then flag="--prerelease"; fi
          # Upload everything to a draft first, then publish, so a failed upload never leaves a
          # half-populated public release.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --target "$GITHUB_SHA" $flag \
            --title "$(cat "$RUNNER_TEMP/title.txt")" --notes-file "$RUNNER_TEMP/notes.md" \
            dist-release/*
          expected=$(ls dist-release | sort)
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          if [ "$expected" != "$uploaded" ]; then
            echo "Uploaded assets do not match the built packages" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Point the beta channel at this release
        shell: bash
        run: |
          set -euo pipefail
          # The beta updater reads latest.json from a rolling "updater-beta" prerelease, updated
          # by every release, so beta users also receive each newer stable release.
          if ! gh release view updater-beta >/dev/null 2>&1; then
            gh release create updater-beta --prerelease --title "Beta updater channel" \
              --notes "Updater manifest for beta releases. Install releases from their own pages."
          fi
          gh release upload updater-beta dist-release/latest.json --clobber
