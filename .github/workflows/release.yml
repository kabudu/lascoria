# Release Lascoria from a version tag, following the qatq release process:
#
# * a pushed tag such as v1.2.3 (or v1.2.3-beta.1 for a prerelease) starts it;
# * the tag must point at a commit on the default branch, and every version field,
#   the CHANGELOG.md section and the curated docs/releases/v<version>.md must agree
#   (scripts/release.js verify);
# * each supported OS/architecture is built natively; updater artifacts are signed;
#   macOS applications are signed/notarized; Windows publisher signing is deferred;
# * updater bundles are signed with the maintainer's updater key, and a
#   latest.json containing artifact signatures plus SHA256SUMS.txt are generated;
# * a GitHub Release is created with the curated title and notes and every package.
#
# Hosted Actions stay disabled while the repository is private; this workflow also skips
# itself on a private repository. Required secrets and variables are listed in
# docs/RELEASE.md. Nothing here pushes commits or tags.
name: Release
on:
  # Signed candidate artifacts for native acceptance, without publication.
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - name: Require release tags to point at the default branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - name: Check versions, CHANGELOG and curated notes against the tag
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="v$(node -p 'require("./package.json").version')"
          fi
          result=$(node scripts/release.js verify "$tag")
          echo "version=$(jq -r .version <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Refuse known vulnerabilities and unreviewed licences or advisories
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rustup toolchain install 1.97 --profile minimal
          cargo install cargo-audit --locked --version 0.22.2
          node scripts/check-supply-chain.js
      - name: Require release signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBKEY: ${{ vars.LASCORIA_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY must be configured}"
          : "${UPDATER_PUBKEY:?The LASCORIA_UPDATER_PUBKEY variable must be configured}"
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE must be configured}"
          : "${APPLE_ID:?APPLE_ID must be configured}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID must be configured}"

  validate:
    needs: plan
    uses: ./.github/workflows/validate.yml

  build:
    needs: plan
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-universal, runner: macos-15, bundles: 'app,dmg' }
          - { target: windows-x86_64, runner: windows-2022, bundles: 'nsis' }
          - { target: linux-x86_64, runner: ubuntu-22.04, bundles: 'appimage,deb' }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.97'
      VERSION: ${{ needs.plan.outputs.version }}
      # Baked into the desktop binary: the updater accepts only bundles signed by this key.
      LASCORIA_UPDATER_PUBKEY: ${{ vars.LASCORIA_UPDATER_PUBKEY }}
      # Baked into the macOS supervisor: it accepts only a desktop signed by this team (F1).
      LASCORIA_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97 --profile minimal
      - run: npm ci
      - name: Prepare both macOS architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          node_version="$(node -p process.version)"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 120 "https://nodejs.org/dist/$node_version/SHASUMS256.txt" -o SHASUMS256.txt
          for arch in arm64 x64; do
            file="node-$node_version-darwin-$arch.tar.gz"
            curl --fail --location --retry 3 --max-time 120 "https://nodejs.org/dist/$node_version/$file" -o "$file"
            grep "  $file$" SHASUMS256.txt > "$arch.sha256"
            shasum -a 256 --check "$arch.sha256"
            tar -xzf "$file"
          done
          {
            echo "NODE_DARWIN_ARM64=$RUNNER_TEMP/node-$node_version-darwin-arm64/bin/node"
            echo "NODE_DARWIN_X64=$RUNNER_TEMP/node-$node_version-darwin-x64/bin/node"
            echo "LASCORIA_UNIVERSAL=1"
            echo "LASCORIA_BUNDLE_DIR=$GITHUB_WORKSPACE/src-tauri/target/universal-apple-darwin/release/bundle"
          } >> "$GITHUB_ENV"
      - name: Build the UI and the installed runtime (bundled Node, SDK and supervisor)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            npm run ui:build
            node scripts/package-runtime.js --universal
          else
            npm run desktop:prepare
          fi
      - name: Import the Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          keychains=()
          while IFS= read -r item; do
            item="${item#*\"}"
            item="${item%\"*}"
            keychains+=("$item")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign bundled runtime executables for notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sign-macos-runtime.js
      - name: Build, sign and notarize the desktop bundles
        shell: bash
        run: |
          set -euo pipefail
          # The runtime is already prepared (and signed on macOS); do not rebuild it here.
          config='{"build":{"beforeBuildCommand":"npm run ui:build"},"bundle":{"active":true,"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"'"$LASCORIA_UPDATER_PUBKEY"'"}}}'
          if [ "$RUNNER_OS" = macOS ]; then
            npx tauri build --target universal-apple-darwin --bundles app --config "$config"
            node scripts/package-macos-distribution.js
          else
            npx tauri build --bundles "${{ matrix.bundles }}" --config "$config"
          fi
      - name: Verify tickets and signatures in the actual macOS packages
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-distribution.js
      - name: Verify signed runtime provenance after bundling
        if: runner.os == 'macOS'
        run: node scripts/sign-macos-runtime.js --verify "$LASCORIA_BUNDLE_DIR/macos/Lascoria.app/Contents/Resources/runtime"
      - name: Stage packages under release names
        shell: bash
        run: node scripts/release-artifacts.js stage "${{ matrix.target }}" "$VERSION" dist-release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    # Manual runs only upload candidate artifacts; a reviewed version tag publishes.
    if: github.event_name == 'push'
    needs: [plan, validate, build]
    concurrency:
      group: lascoria-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - name: Write release notes, the updater manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release.js title "$VERSION" > "$RUNNER_TEMP/title.txt"
          node scripts/release.js notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          node scripts/release-artifacts.js manifest dist-release "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      - name: Reconcile and publish immutable release artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-release.js release "$GITHUB_REF_NAME" "$GITHUB_SHA" dist-release "$RUNNER_TEMP/title.txt" "$RUNNER_TEMP/notes.md"
      - name: Reconcile the beta updater channel without regressing it
        shell: bash
        env:
          LASCORIA_SERIALIZED_PUBLISH: '1'
        run: node scripts/publish-release.js beta "$GITHUB_SHA" dist-release/latest.json
